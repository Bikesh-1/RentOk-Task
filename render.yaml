services:
  - type: web
    name: rentok-llm-gateway
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_DEFAULT_MODEL
        value: gpt-4o-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.0-flash
      - key: OPENAI_INPUT_USD_PER_1M
        value: "0.15"
      - key: OPENAI_OUTPUT_USD_PER_1M
        value: "0.60"
      - key: GEMINI_INPUT_USD_PER_1M
        value: "0.10"
      - key: GEMINI_OUTPUT_USD_PER_1M
        value: "0.40"
      - key: BUDGET_ESTIMATE_MULTIPLIER
        value: "1.5"
      - key: MAX_OUTPUT_TOKENS
        value: "4096"
